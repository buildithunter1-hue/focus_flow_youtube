<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ session_name }} - Focus Flow</title>

    <!-- Focus tracker deps -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- HLS.js for HLS streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e5e7eb;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }
        .header h1 { font-size: 1.2rem; color: #fff; font-weight: 700; }
        .header .session-info { font-size: 0.85rem; color: rgba(255,255,255,0.9); }
        .status-dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; margin-right: 6px;
        }
        .status-dot.active { background: #4ade80; }
        .status-dot.inactive { background: #ef4444; }

        .error-banner {
            background: rgba(239, 68, 68, 0.2); color: #fca5a5;
            padding: 10px 16px; text-align: center; font-size: 0.85rem;
            display: none; border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .status-bar {
            text-align: center; padding: 10px; border-radius: 8px;
            font-size: 13px; margin-bottom: 12px;
        }
        .status-bar.connected { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .status-bar.disconnected { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .status-bar.connecting { background: rgba(234, 179, 8, 0.2); color: #eab308; }

        .main-container {
            display: grid; grid-template-columns: 1fr 360px;
            gap: 16px; padding: 16px; min-height: calc(100vh - 60px);
        }
        .left-column { display: flex; flex-direction: column; gap: 16px; }
        .video-area {
            background: #000; border-radius: 12px; overflow: hidden;
            position: relative; display: flex; align-items: center;
            justify-content: center; aspect-ratio: 16/9;
        }
        .video-area iframe, .video-area video {
            width: 100%; height: 100%; border: none;
        }

        .focus-panel {
            background: #1e293b; border-radius: 16px; padding: 20px;
            border: 1px solid #334155; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #e5e7eb; }

        .focus-cam {
            position: relative; width: 100%; aspect-ratio: 4/3;
            background: #000; border-radius: 12px; overflow: hidden;
        }
        .focus-cam video, .focus-cam canvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; transform: scaleX(-1);
        }
        .focus-cam canvas { pointer-events: none; }

        .metrics-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-top: 12px;
        }
        .metric-card {
            background: #0f172a; border: 1px solid #334155;
            border-radius: 12px; padding: 12px; text-align: center;
        }
        .metric-label {
            font-size: 10px; color: #94a3b8; text-transform: uppercase;
            font-weight: 600; margin-bottom: 6px; letter-spacing: 0.4px;
        }
        .metric-value { font-size: 20px; font-weight: 700; color: #e5e7eb; }
        .emotion-display { font-size: 28px; }
        .emotion-name { font-size: 11px; color: #94a3b8; margin-top: 4px; text-transform: capitalize; }

        .attention-bar-wrap { margin-top: 10px; }
        .attention-bar {
            width: 100%; height: 10px; background: #334155;
            border-radius: 5px; overflow: hidden;
        }
        .attention-fill {
            height: 100%; border-radius: 5px;
            transition: width 0.5s ease, background 0.5s ease;
        }

        .stat-row {
            display: flex; justify-content: space-between;
            padding: 5px 0; font-size: 0.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .stat-label { color: #94a3b8; }
        .stat-value { color: #fff; font-weight: 600; }

        .chart-wrap { height: 160px; margin-top: 10px; }

        /* Default desktop: focus-mobile-row is just a block wrapper */
        .focus-mobile-row { display: block; }
        .mobile-stats-row { display: block; }

        .debug-info {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10px; color: #94a3b8; margin-top: 8px;
            padding: 5px 8px; background: #0f172a;
            border-radius: 6px; border: 1px solid #334155;
        }

        .join-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); display: flex;
            align-items: center; justify-content: center; z-index: 1000;
        }
        .join-card {
            background: #1e293b; border-radius: 16px; padding: 32px;
            text-align: center; max-width: 420px; width: 90%;
            border: 1px solid #334155; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .join-card h2 { margin-bottom: 8px; color: #fff; font-size: 24px; }
        .join-card p { color: #94a3b8; margin-bottom: 24px; font-size: 0.9rem; }
        .join-card input {
            width: 100%; padding: 14px 18px; border-radius: 10px;
            border: 2px solid #334155; background: #0f172a;
            color: #e5e7eb; font-size: 1rem; margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        .join-card input:focus { outline: none; border-color: #667eea; }
        .join-card button {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: transform 0.2s;
        }
        .join-card button:hover { transform: translateY(-2px); }

        /* ===== Mobile Responsive ===== */
        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
                min-height: auto;
                gap: 10px;
                padding: 10px;
            }

            /* Move focus panel ABOVE the video */
            .focus-panel {
                order: -1;
                padding: 12px 14px;
                border-radius: 12px;
            }

            .left-column {
                order: 0;
            }

            .video-area {
                min-height: 220px;
            }

            .card-title {
                font-size: 13px;
                margin-bottom: 8px;
            }

            .status-bar {
                padding: 6px 8px;
                font-size: 11px;
                margin-bottom: 8px;
                border-radius: 6px;
            }

            /* Compact cam + metrics row */
            .focus-mobile-row {
                display: flex;
                gap: 10px;
                align-items: stretch;
            }

            .focus-cam {
                width: 100px;
                min-width: 100px;
                aspect-ratio: 1/1;
                border-radius: 10px;
                flex-shrink: 0;
            }

            .metrics-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
                margin-top: 0;
                flex: 1;
            }

            .metric-card {
                padding: 8px 6px;
                border-radius: 8px;
            }

            .metric-label {
                font-size: 8px;
                margin-bottom: 3px;
                letter-spacing: 0.3px;
            }

            .metric-value {
                font-size: 15px;
            }

            .emotion-display {
                font-size: 20px;
            }

            .emotion-name {
                font-size: 9px;
            }

            /* Compact bottom stats */
            .attention-bar-wrap {
                margin-top: 8px;
            }

            .attention-bar {
                height: 6px;
            }

            .mobile-stats-row {
                display: flex;
                gap: 12px;
                margin-top: 6px;
            }

            .stat-row {
                padding: 3px 0;
                font-size: 0.7rem;
                border-bottom: none;
                flex: 1;
            }

            .debug-info {
                font-size: 9px;
                padding: 4px 6px;
                margin-top: 6px;
            }

            /* Hide chart on mobile portrait to save space */
            .chart-wrap {
                height: 100px;
                margin-top: 8px;
            }

            .header {
                padding: 10px 14px;
            }

            .header h1 {
                font-size: 1rem;
            }

            .header .session-info {
                font-size: 0.75rem;
            }
        }

        /* ===== Mobile Landscape ===== */
        @media (max-width: 900px) and (orientation: landscape) {
            .main-container {
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 8px;
            }

            .focus-panel {
                order: -1;
                padding: 10px 12px;
            }

            .card-title {
                font-size: 12px;
                margin-bottom: 6px;
            }

            .status-bar {
                padding: 4px 8px;
                font-size: 10px;
                margin-bottom: 6px;
            }

            .focus-cam {
                width: 80px;
                min-width: 80px;
            }

            .metrics-grid {
                gap: 4px;
            }

            .metric-card {
                padding: 6px 4px;
            }

            .metric-label {
                font-size: 7px;
                margin-bottom: 2px;
            }

            .metric-value {
                font-size: 13px;
            }

            .emotion-display {
                font-size: 16px;
            }

            .emotion-name {
                font-size: 8px;
            }

            .attention-bar-wrap {
                margin-top: 6px;
            }

            .attention-bar {
                height: 5px;
            }

            /* Hide chart and debug in landscape to keep it ultra compact */
            .chart-wrap {
                display: none;
            }

            .debug-info {
                display: none;
            }

            .stat-row {
                font-size: 0.65rem;
                padding: 2px 0;
            }

            .video-area {
                min-height: 200px;
            }

            .header {
                padding: 6px 12px;
            }

            .header h1 {
                font-size: 0.9rem;
            }
        }

        /* ===== Very small phones ===== */
        @media (max-width: 480px) {
            .focus-cam {
                width: 80px;
                min-width: 80px;
            }

            .metric-value {
                font-size: 13px;
            }

            .emotion-display {
                font-size: 18px;
            }

            .video-area {
                min-height: 200px;
                aspect-ratio: auto;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div><h1>{{ session_name }}</h1></div>
        <span class="session-info">
            <span class="status-dot active" id="statusDot"></span>
            Teacher: {{ teacher_name }}
        </span>
    </div>
    <div class="error-banner" id="errorBanner"></div>

    <!-- Join Overlay -->
    <div class="join-overlay" id="joinOverlay">
        <div class="join-card">
            <h2>Join Session</h2>
            <p>{{ session_name }} by {{ teacher_name }}</p>
            <input type="text" id="studentNameInput" placeholder="Enter your name" autofocus>
            <button onclick="joinSession()">Join &amp; Start Watching</button>
        </div>
    </div>

    <div class="main-container">
        <div class="left-column">
            <div class="video-area" id="videoArea">
                <!-- Video content injected by JS based on content_type -->
            </div>
        </div>

        <!-- Focus Tracker (moves above video on mobile) -->
        <div class="focus-panel">
            <div class="card-title">Focus Tracker</div>
            <div id="focusStatusBar" class="status-bar connecting">Initializing focus tracker...</div>

            <div class="focus-mobile-row">
                <div class="focus-cam">
                    <video id="webcam" autoplay muted playsinline></video>
                    <canvas id="canvas"></canvas>
                </div>

                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-label">Attention</div>
                        <div class="metric-value" id="attentionScore">--</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Engagement</div>
                        <div class="metric-value" id="engagementLevel">--</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Mood</div>
                        <div class="emotion-display" id="emotionDisplay">--</div>
                        <div class="emotion-name" id="emotionName">detecting...</div>
                    </div>
                </div>
            </div>

            <div class="debug-info" id="debugInfo">Initializing face detection...</div>

            <div class="attention-bar-wrap">
                <div class="attention-bar">
                    <div class="attention-fill" id="attentionBar" style="width:0%;background:#ef4444;"></div>
                </div>
            </div>

            <div class="mobile-stats-row" style="margin-top:10px;">
                <div class="stat-row">
                    <span class="stat-label">Face Detected</span>
                    <span class="stat-value" id="faceValue">--</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Gaze On Screen</span>
                    <span class="stat-value" id="gazeValue">--</span>
                </div>
            </div>

            <div class="chart-wrap">
                <canvas id="attentionChart"></canvas>
            </div>
        </div>
    </div>
    <script>
        // ============================
        // Session data from server
        // ============================
        var SESSION_ID = "{{ session_id }}";
        var CONTENT_TYPE = "{{ content_type }}";
        var CONTENT_URL = "{{ content_url }}";
        var EMBED_INFO = JSON.parse('{{ embed_info | tojson }}');

        var studentId = null;
        var studentName = '';
        var studentGuid = '';

        // ============================
        // Focus Tracker State
        // ============================
        var POLL_INTERVAL = 30 * 1000;
        var EMOTION_DETECT_INTERVAL = 500;

        var faceMeshInstance = null;
        var cameraObj = null;
        var faceApiReady = false;
        var emotionHistory = [];
        var currentEmotion = 'neutral';
        var lastEmotionDetectTime = 0;
        var previousAttentionScore = 0;
        var eyesClosedCount = 0;

        var isSessionActive = false;
        var attentionChart = null;
        var attentionData = [];
        var reportIntervalId = null;

        var batchAccumulator = {
            count: 0,
            attentionSum: 0,
            facePresentCount: 0,
            gazeOnScreenCount: 0,
            eyesClosedCount: 0,
            emotions: {}
        };

        var emotionEmojis = {
            happy: '🙂', surprised: '😮', angry: '😠', sad: '😢',
            fearful: '😨', disgusted: '🤢', neutral: '😐'
        };

        // Eye landmark indices for EAR calculation
        var LEFT_EYE_IDX = [362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398];
        var RIGHT_EYE_IDX = [33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246];
        var RIGHT_IRIS_CENTER = 468;
        var LEFT_IRIS_CENTER = 473;

        var windowFocused = true;
        window.addEventListener('focus', function() { windowFocused = true; });
        window.addEventListener('blur', function() { windowFocused = false; });

        // ============================
        // Embed Video
        // ============================
        function embedVideo() {
            var area = document.getElementById('videoArea');

            if (CONTENT_TYPE === 'youtube') {
                var embedUrl = EMBED_INFO.embed_url || CONTENT_URL;
                var sep = embedUrl.indexOf('?') !== -1 ? '&' : '?';
                embedUrl += sep + 'origin=' + encodeURIComponent(window.location.origin);
                area.innerHTML = '<iframe src="' + embedUrl + '" ' +
                    'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" ' +
                    'referrerpolicy="no-referrer-when-downgrade" ' +
                    'allowfullscreen style="width:100%;height:100%;border:none;"></iframe>';
            } else if (CONTENT_TYPE === 'vimeo') {
                var vimeoUrl = EMBED_INFO.embed_url || CONTENT_URL;
                area.innerHTML = '<iframe src="' + vimeoUrl + '" ' +
                    'allow="autoplay; fullscreen; picture-in-picture" ' +
                    'referrerpolicy="no-referrer-when-downgrade" ' +
                    'allowfullscreen style="width:100%;height:100%;border:none;"></iframe>';
            } else if (CONTENT_TYPE === 'hls') {
                area.innerHTML = '<video id="hlsVideo" controls autoplay style="width:100%;height:100%;"></video>';
                var video = document.getElementById('hlsVideo');
                if (Hls.isSupported()) {
                    var hls = new Hls();
                    hls.loadSource(CONTENT_URL);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = CONTENT_URL;
                    video.addEventListener('loadedmetadata', function() { video.play(); });
                }
            } else {
                area.innerHTML = '<video controls autoplay style="width:100%;height:100%;">' +
                    '<source src="' + CONTENT_URL + '" type="video/mp4">' +
                    'Your browser does not support the video tag.</video>';
            }
        }

        // ============================
        // Join Session
        // ============================
        async function joinSession() {
            var nameInput = document.getElementById('studentNameInput');
            studentName = nameInput.value.trim() || 'Anonymous';
            studentId = 'S_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

            document.getElementById('joinOverlay').style.display = 'none';
            embedVideo();
            startFocusTracker();
        }

        // ============================
        // Focus Status Helper
        // ============================
        function setFocusStatus(type, message) {
            var el = document.getElementById('focusStatusBar');
            if (!el) return;
            el.className = 'status-bar ' + type;
            el.textContent = message;
        }

        function showError(msg) {
            var banner = document.getElementById('errorBanner');
            banner.textContent = msg;
            banner.style.display = 'block';
        }

        // ============================
        // face-api.js Emotion Detection
        // ============================
        async function loadFaceApiModels() {
            try {
                var MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
                ]);
                faceApiReady = true;
                return true;
            } catch (e) {
                console.error('Failed to load face-api models:', e);
                faceApiReady = false;
                return false;
            }
        }

        async function detectEmotionWithFaceApi(video) {
            if (!faceApiReady || !video) return null;
            try {
                var detection = await faceapi
                    .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 }))
                    .withFaceExpressions();

                if (!detection || !detection.expressions) return null;

                var maxEmotion = 'neutral';
                var maxProb = 0;
                for (var emo in detection.expressions) {
                    if (detection.expressions[emo] > maxProb) {
                        maxProb = detection.expressions[emo];
                        maxEmotion = emo;
                    }
                }
                return maxEmotion;
            } catch (e) {
                return null;
            }
        }

        function getSmoothedEmotion(cur) {
            emotionHistory.push(cur);
            if (emotionHistory.length > 5) emotionHistory.shift();

            var counts = {};
            for (var i = 0; i < emotionHistory.length; i++) {
                counts[emotionHistory[i]] = (counts[emotionHistory[i]] || 0) + 1;
            }

            var best = cur, bestC = 0;
            for (var em in counts) {
                if (counts[em] > bestC) { bestC = counts[em]; best = em; }
            }
            return best;
        }

        // ============================
        // Geometry Helpers
        // ============================
        function euclideanDist(a, b, width, height) {
            var dx = (a.x - b.x) * width;
            var dy = (a.y - b.y) * height;
            return Math.hypot(dx, dy);
        }

        function eyeAspectRatio(landmarks, indices, width, height) {
            var pts = indices.slice(0, 6).map(function(i) { return landmarks[i]; });
            var v1 = euclideanDist(pts[1], pts[5], width, height);
            var v2 = euclideanDist(pts[2], pts[4], width, height);
            var h  = euclideanDist(pts[0], pts[3], width, height);
            return h <= 1e-6 ? 0 : (v1 + v2) / (2.0 * h);
        }

        function estimateGazeDirection(landmarks) {
            var rightEyeInner = landmarks[133];
            var rightEyeOuter = landmarks[33];
            var leftEyeInner = landmarks[362];
            var leftEyeOuter = landmarks[263];
            var rightIris = landmarks[RIGHT_IRIS_CENTER];
            var leftIris = landmarks[LEFT_IRIS_CENTER];

            if (!rightEyeInner || !rightEyeOuter || !leftEyeInner || !leftEyeOuter || !rightIris || !leftIris) {
                return { lookingCenter: true };
            }

            var rightEyeWidth = rightEyeOuter.x - rightEyeInner.x;
            var rightIrisRatio = (rightIris.x - rightEyeInner.x) / (rightEyeWidth + 0.001);

            var leftEyeWidth = leftEyeInner.x - leftEyeOuter.x;
            var leftIrisRatio = (leftIris.x - leftEyeOuter.x) / (leftEyeWidth + 0.001);

            var avg = (rightIrisRatio + leftIrisRatio) / 2;
            return { lookingCenter: avg > 0.35 && avg < 0.65 };
        }

        function estimateHeadInFocus(landmarks) {
            var leftEye = landmarks[33];
            var rightEye = landmarks[263];
            var nose = landmarks[1];
            if (!leftEye || !rightEye || !nose) return { inFocus: true };

            var midEyeX = (leftEye.x + rightEye.x) / 2.0;
            var offsetX = Math.abs(nose.x - midEyeX);
            return { inFocus: offsetX < 0.06 };
        }

        // ============================
        // Attention Chart
        // ============================
        function initAttentionChart() {
            var el = document.getElementById('attentionChart');
            if (!el) return;
            var ctx = el.getContext('2d');
            attentionChart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [{ data: [], fill: true, tension: 0.35,
                    borderColor: '#667eea', backgroundColor: 'rgba(102, 126, 234, 0.15)',
                    borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#667eea' }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, max: 100, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                        x: { ticks: { color: '#94a3b8', maxTicksLimit: 6 }, grid: { color: '#334155' } }
                    }
                }
            });
        }

        function updateAttentionChart() {
            if (!attentionChart) return;
            attentionChart.data.labels = attentionData.map(function(d) { return d.time; });
            attentionChart.data.datasets[0].data = attentionData.map(function(d) { return d.value; });
            attentionChart.update('none');
        }

        // ============================
        // UI Updates
        // ============================
        function updateFocusUI(attention, engagement, emotion) {
            var scoreEl = document.getElementById('attentionScore');
            var engEl = document.getElementById('engagementLevel');
            var emoEl = document.getElementById('emotionDisplay');
            var emoNameEl = document.getElementById('emotionName');

            if (scoreEl) scoreEl.textContent = attention + '%';
            if (engEl) engEl.textContent = engagement.toUpperCase();
            if (emoEl) emoEl.textContent = emotionEmojis[emotion] || '😐';
            if (emoNameEl) emoNameEl.textContent = emotion;

            var bar = document.getElementById('attentionBar');
            if (bar) {
                bar.style.width = attention + '%';
                if (attention >= 70) bar.style.background = '#22c55e';
                else if (attention >= 40) bar.style.background = '#eab308';
                else bar.style.background = '#ef4444';
            }

            if (batchAccumulator.count > 0) {
                var faceRatio = batchAccumulator.facePresentCount / batchAccumulator.count;
                var gazeRatio = batchAccumulator.gazeOnScreenCount / batchAccumulator.count;
                var faceEl = document.getElementById('faceValue');
                var gazeEl = document.getElementById('gazeValue');
                if (faceEl) faceEl.textContent = Math.round(faceRatio * 100) + '%';
                if (gazeEl) gazeEl.textContent = Math.round(gazeRatio * 100) + '%';
            }
        }

        // ============================
        // Batch Accumulator
        // ============================
        function resetAccumulator() {
            batchAccumulator = {
                count: 0, attentionSum: 0, facePresentCount: 0,
                gazeOnScreenCount: 0, eyesClosedCount: 0, emotions: {}
            };
        }

        // ============================
        // Analytics API calls
        // ============================
        async function joinAnalytics() {
            try {
                var resp = await fetch('/api/student/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_id: studentId,
                        name: studentName,
                        session_id: SESSION_ID
                    })
                });
                if (!resp.ok) throw new Error('join failed');
                var result = await resp.json();
                studentGuid = result.guid;
                setFocusStatus('connected', 'Focus tracker connected');
            } catch (e) {
                console.error('Join failed:', e);
                setFocusStatus('disconnected', 'Focus tracker cannot reach backend');
            }
        }

        async function sendReport() {
            if (!isSessionActive || batchAccumulator.count === 0) return;

            var count = batchAccumulator.count;
            var avgAttention = Math.round(batchAccumulator.attentionSum / count);
            var faceRatio = batchAccumulator.facePresentCount / count;
            var gazeRatio = batchAccumulator.gazeOnScreenCount / count;

            var dominantEmotion = 'neutral', maxC = 0;
            for (var emo in batchAccumulator.emotions) {
                if (batchAccumulator.emotions[emo] > maxC) {
                    maxC = batchAccumulator.emotions[emo];
                    dominantEmotion = emo;
                }
            }

            var engagementLevel = avgAttention >= 70 ? 'high' : avgAttention >= 40 ? 'medium' : 'low';

            var payload = {
                student_id: studentId,
                name: studentName,
                guid: studentGuid,
                session_id: SESSION_ID,
                face_present_ratio: Number(faceRatio.toFixed(2)),
                gaze_on_screen_ratio: Number(gazeRatio.toFixed(2)),
                blink_rate: 0,
                attention_score: avgAttention,
                emotion: dominantEmotion,
                engagement_level: engagementLevel
            };

            try {
                var resp = await fetch('/api/student/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (resp.ok) setFocusStatus('connected', 'Monitoring active');
                else setFocusStatus('disconnected', 'Update failed');

                attentionData.push({ time: new Date().toLocaleTimeString(), value: avgAttention });
                if (attentionData.length > 20) attentionData.shift();
                updateAttentionChart();

                resetAccumulator();
            } catch (e) {
                setFocusStatus('disconnected', 'Update error');
            }
        }

        // ============================
        // MediaPipe FaceMesh + Camera
        // ============================
        async function startMediaPipe() {
            var video = document.getElementById('webcam');
            var canvas = document.getElementById('canvas');
            if (!video || !canvas) return;

            var ctx = canvas.getContext('2d');

            if (!window.isSecureContext) {
                setFocusStatus('disconnected', 'HTTPS required for camera access');
                showError('Webcam requires HTTPS. Please access this page over HTTPS for face analytics.');
                return;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setFocusStatus('disconnected', 'Browser does not support webcam');
                showError('Your browser does not support webcam access.');
                return;
            }

            var attempts = 0;
            while ((!window.Camera || !window.FaceMesh) && attempts < 50) {
                await new Promise(function(r) { setTimeout(r, 100); });
                attempts++;
            }
            if (!window.FaceMesh) {
                setFocusStatus('disconnected', 'FaceMesh failed to load');
                return;
            }

            faceMeshInstance = new window.FaceMesh({
                locateFile: function(file) { return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/' + file; }
            });

            faceMeshInstance.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            faceMeshInstance.onResults(function(results) { onResults(results, canvas, ctx); });

            cameraObj = new window.Camera(video, {
                onFrame: async function() { await faceMeshInstance.send({ image: video }); },
                width: 640,
                height: 480
            });

            try {
                await cameraObj.start();
                setFocusStatus('connected', 'Camera started - tracking focus');
            } catch (e) {
                console.warn('Camera start failed:', e);
                if (e.name === 'NotAllowedError') {
                    setFocusStatus('disconnected', 'Camera permission denied');
                    showError('Camera permission denied. Please allow camera access and reload.');
                } else if (e.name === 'NotFoundError') {
                    setFocusStatus('disconnected', 'No camera found');
                    showError('No camera found. Please connect a camera and reload.');
                } else {
                    setFocusStatus('disconnected', 'Camera failed to start');
                    showError('Webcam not available. Analytics will be limited.');
                }
            }
        }

        // ============================
        // FaceMesh Results Handler
        // ============================
        function onResults(results, canvas, ctx) {
            if (!results || !results.image) return;

            if (canvas.width !== results.image.width) {
                canvas.width = results.image.width;
                canvas.height = results.image.height;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            var currentAttention = 0;
            var emotion = 'neutral';

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                var landmarks = results.multiFaceLandmarks[0];

                var headPose = estimateHeadInFocus(landmarks);
                var gaze = estimateGazeDirection(landmarks);

                var now = Date.now();
                if (faceApiReady && (now - lastEmotionDetectTime) >= EMOTION_DETECT_INTERVAL) {
                    lastEmotionDetectTime = now;
                    detectEmotionWithFaceApi(document.getElementById('webcam')).then(function(detected) {
                        if (detected) currentEmotion = getSmoothedEmotion(detected);
                    });
                }
                emotion = currentEmotion;

                var leftEAR = eyeAspectRatio(landmarks, LEFT_EYE_IDX, canvas.width, canvas.height);
                var rightEAR = eyeAspectRatio(landmarks, RIGHT_EYE_IDX, canvas.width, canvas.height);
                var avgEAR = (leftEAR + rightEAR) / 2.0;
                var eyesClosed = avgEAR < 0.21;

                eyesClosedCount = eyesClosed ? (eyesClosedCount + 1) : Math.max(0, eyesClosedCount - 1);
                var prolongedEyesClosed = eyesClosedCount > 10;

                var targetScore = 0;
                if (headPose.inFocus) targetScore += 0.35;
                if (gaze.lookingCenter) targetScore += 0.35;
                if (!eyesClosed) targetScore += 0.15;
                if (emotion === 'happy' || emotion === 'neutral') targetScore += 0.15;
                if (prolongedEyesClosed) targetScore = Math.min(targetScore, 0.25);

                var rate = targetScore > previousAttentionScore ? 0.12 : 0.08;
                var smoothed = previousAttentionScore + (targetScore - previousAttentionScore) * rate;
                previousAttentionScore = smoothed;
                currentAttention = Math.round(smoothed * 100);

                batchAccumulator.count++;
                batchAccumulator.attentionSum += currentAttention;
                batchAccumulator.facePresentCount++;
                if (gaze.lookingCenter) batchAccumulator.gazeOnScreenCount++;
                if (eyesClosed) batchAccumulator.eyesClosedCount++;
                batchAccumulator.emotions[emotion] = (batchAccumulator.emotions[emotion] || 0) + 1;

                var dbg = document.getElementById('debugInfo');
                if (dbg) dbg.textContent = 'Head:' + (headPose.inFocus ? 'OK' : 'Away') +
                    ' | Gaze:' + (gaze.lookingCenter ? 'OK' : 'Away') +
                    ' | Emotion:' + emotion + ' | EAR:' + avgEAR.toFixed(2);

                ctx.strokeStyle = '#4ade80';
                ctx.lineWidth = 1.5;
                var faceOutline = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288,
                    397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136,
                    172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109, 10];
                ctx.beginPath();
                for (var i = 0; i < faceOutline.length; i++) {
                    var idx = faceOutline[i];
                    if (idx < landmarks.length) {
                        var x = landmarks[idx].x * canvas.width;
                        var y = landmarks[idx].y * canvas.height;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                }
                ctx.stroke();
            } else {
                previousAttentionScore *= 0.95;
                currentAttention = Math.round(previousAttentionScore * 100);

                batchAccumulator.count++;
                batchAccumulator.attentionSum += currentAttention;
                batchAccumulator.emotions['neutral'] = (batchAccumulator.emotions['neutral'] || 0) + 1;

                var dbgEl = document.getElementById('debugInfo');
                if (dbgEl) dbgEl.textContent = 'No face detected';
            }

            var engagement = currentAttention >= 70 ? 'high' : currentAttention >= 40 ? 'medium' : 'low';
            updateFocusUI(currentAttention, engagement, emotion);
        }

        // ============================
        // Start Focus Tracker
        // ============================
        async function startFocusTracker() {
            if (isSessionActive) return;

            setFocusStatus('connecting', 'Loading focus models...');
            if (!attentionChart) initAttentionChart();

            await loadFaceApiModels();
            await joinAnalytics();

            isSessionActive = true;

            setTimeout(sendReport, 10000);
            reportIntervalId = setInterval(sendReport, POLL_INTERVAL);

            await startMediaPipe();
        }

        // ============================
        // Cleanup
        // ============================
        function analyticsLeave() {
            if (!studentId) return;
            try {
                var payload = JSON.stringify({
                    student_id: studentId,
                    name: studentName,
                    session_id: SESSION_ID
                });
                navigator.sendBeacon('/api/student/leave',
                    new Blob([payload], { type: 'application/json' }));
            } catch (e) { /* ignore */ }
        }

        window.addEventListener('beforeunload', function() {
            isSessionActive = false;
            if (reportIntervalId) { clearInterval(reportIntervalId); reportIntervalId = null; }
            // Use sendBeacon for reliable delivery during page unload
            if (batchAccumulator.count > 0 && studentId) {
                var count = batchAccumulator.count;
                var avgAttention = Math.round(batchAccumulator.attentionSum / count);
                var faceRatio = batchAccumulator.facePresentCount / count;
                var gazeRatio = batchAccumulator.gazeOnScreenCount / count;
                var dominantEmotion = 'neutral', maxC = 0;
                for (var emo in batchAccumulator.emotions) {
                    if (batchAccumulator.emotions[emo] > maxC) {
                        maxC = batchAccumulator.emotions[emo];
                        dominantEmotion = emo;
                    }
                }
                var engagementLevel = avgAttention >= 70 ? 'high' : avgAttention >= 40 ? 'medium' : 'low';
                var updatePayload = JSON.stringify({
                    student_id: studentId,
                    name: studentName,
                    guid: studentGuid,
                    session_id: SESSION_ID,
                    face_present_ratio: Number(faceRatio.toFixed(2)),
                    gaze_on_screen_ratio: Number(gazeRatio.toFixed(2)),
                    blink_rate: 0,
                    attention_score: avgAttention,
                    emotion: dominantEmotion,
                    engagement_level: engagementLevel
                });
                navigator.sendBeacon('/api/student/update',
                    new Blob([updatePayload], { type: 'application/json' }));
            }
            analyticsLeave();
            if (cameraObj) { try { cameraObj.stop(); } catch (e) { /* ignore */ } }
        });

        document.getElementById('studentNameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') joinSession();
        });
    </script>
