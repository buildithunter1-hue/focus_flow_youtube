<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Flow - Teacher Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1a3e, #2d1b69);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 { font-size: 1.3rem; color: #fff; }
        .header nav a {
            color: #9ecfff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.9rem;
        }
        .header nav a:hover { color: #fff; }
        .container { max-width: 1000px; margin: 0 auto; padding: 24px; }

        /* Auth Section */
        .auth-section {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .auth-section h2 { margin-bottom: 16px; font-size: 1.1rem; }
        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .form-row input, .form-row select {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #0f0f23;
            color: #fff;
            font-size: 0.9rem;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; }

        /* Session Creation */
        .create-section {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            display: none;
        }
        .create-section h2 { margin-bottom: 16px; font-size: 1.1rem; }

        /* Sessions List */
        .sessions-section {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            display: none;
        }
        .sessions-section h2 { margin-bottom: 16px; font-size: 1.1rem; }
        .session-card {
            background: #0f0f23;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .session-card .info h3 { font-size: 1rem; color: #fff; margin-bottom: 4px; }
        .session-card .info p { font-size: 0.8rem; color: #888; }
        .session-card .actions { display: flex; gap: 8px; align-items: center; }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-active { background: rgba(74,222,128,0.15); color: #4ade80; }
        .badge-closed { background: rgba(239,68,68,0.15); color: #ef4444; }
        .share-link {
            background: #0f0f23;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 6px 10px;
            color: #9ecfff;
            font-size: 0.8rem;
            cursor: pointer;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .share-link:hover { border-color: #6366f1; }
        .msg {
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            display: none;
        }
        .msg-success { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
        .msg-error { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
        .empty-state { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Focus Flow - Teacher Dashboard</h1>
        <nav>
            <a href="/teacher/analytics" id="analyticsLink" style="display:none;">Analytics</a>
            <a href="#" id="logoutLink" style="display:none;" onclick="logout()">Logout</a>
        </nav>
    </div>

    <div class="container">
        <!-- Login -->
        <div class="auth-section" id="authSection">
            <h2>Teacher Login</h2>
            <div class="msg msg-error" id="authError"></div>
            <div class="form-row">
                <input type="text" id="teacherName" placeholder="Username">
                <input type="password" id="teacherPassword" placeholder="Password">
                <button class="btn btn-primary" onclick="login()">Login</button>
            </div>
        </div>

        <!-- Create Session -->
        <div class="create-section" id="createSection">
            <h2>Create New Session</h2>
            <div class="msg msg-success" id="createSuccess"></div>
            <div class="msg msg-error" id="createError"></div>
            <div class="form-row">
                <input type="text" id="sessionName" placeholder="Session name (optional)">
            </div>
            <div class="form-row">
                <input type="url" id="contentUrl" placeholder="Content URL (YouTube, Vimeo, MP4, HLS)">
                <select id="contentType">
                    <option value="">Auto-detect</option>
                    <option value="youtube">YouTube</option>
                    <option value="vimeo">Vimeo</option>
                    <option value="mp4">MP4 / Direct Video</option>
                    <option value="hls">HLS Stream</option>
                </select>
            </div>
            <button class="btn btn-success" onclick="createSession()">Create Session</button>
        </div>

        <!-- Active Sessions -->
        <div class="sessions-section" id="sessionsSection">
            <h2>Active Sessions</h2>
            <div id="sessionsList"></div>
        </div>
    </div>

    <script>
        let authToken = localStorage.getItem('teacher_token') || '';
        let teacherName = localStorage.getItem('teacher_name') || '';

        // Check if already logged in
        if (authToken) {
            verifyAndInit();
        }

        async function login() {
            const name = document.getElementById('teacherName').value.trim();
            const pwd = document.getElementById('teacherPassword').value;

            if (!name || !pwd) {
                showMsg('authError', 'Please enter username and password');
                return;
            }

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ teacher_name: name, password: pwd })
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    showMsg('authError', err.detail || 'Login failed');
                    return;
                }

                const data = await resp.json();
                authToken = data.token;
                teacherName = data.teacher_name;
                localStorage.setItem('teacher_token', authToken);
                localStorage.setItem('teacher_name', teacherName);
                showLoggedIn();
            } catch (e) {
                showMsg('authError', 'Connection error');
            }
        }

        async function verifyAndInit() {
            try {
                const resp = await fetch('/api/auth/verify', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (resp.ok) {
                    showLoggedIn();
                } else {
                    localStorage.removeItem('teacher_token');
                    localStorage.removeItem('teacher_name');
                    authToken = '';
                }
            } catch (e) {
                // Token invalid
            }
        }

        function showLoggedIn() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('createSection').style.display = 'block';
            document.getElementById('sessionsSection').style.display = 'block';
            document.getElementById('analyticsLink').style.display = 'inline';
            document.getElementById('logoutLink').style.display = 'inline';
            loadSessions();
        }

        function logout() {
            authToken = '';
            teacherName = '';
            localStorage.removeItem('teacher_token');
            localStorage.removeItem('teacher_name');
            location.reload();
        }

        async function createSession() {
            const name = document.getElementById('sessionName').value.trim();
            const url = document.getElementById('contentUrl').value.trim();
            const type = document.getElementById('contentType').value;

            if (!url) {
                showMsg('createError', 'Please enter a content URL');
                return;
            }

            try {
                const body = { content_url: url };
                if (name) body.session_name = name;
                if (type) body.content_type = type;

                const resp = await fetch('/api/session/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + authToken
                    },
                    body: JSON.stringify(body)
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    showMsg('createError', err.detail || 'Failed to create session');
                    return;
                }

                const data = await resp.json();
                const fullUrl = window.location.origin + data.share_url;
                showMsg('createSuccess', `Session created! Share link: ${fullUrl}`);
                document.getElementById('sessionName').value = '';
                document.getElementById('contentUrl').value = '';
                document.getElementById('contentType').value = '';
                loadSessions();
            } catch (e) {
                showMsg('createError', 'Connection error');
            }
        }

        async function loadSessions() {
            try {
                const resp = await fetch('/api/sessions/active');
                const data = await resp.json();
                const list = document.getElementById('sessionsList');

                if (!data.sessions || data.sessions.length === 0) {
                    list.innerHTML = '<div class="empty-state">No active sessions. Create one above!</div>';
                    return;
                }

                list.innerHTML = data.sessions.map(s => {
                    const shareUrl = window.location.origin + '/session/' + s.session_id;
                    return `
                        <div class="session-card">
                            <div class="info">
                                <h3>${escapeHtml(s.session_name)} <span class="badge badge-active">Active</span></h3>
                                <p>${s.content_type} &bull; ${s.student_count || 0} students &bull; Created ${new Date(s.created_at).toLocaleTimeString()}</p>
                            </div>
                            <div class="actions">
                                <span class="share-link" onclick="copyLink('${shareUrl}')" title="Click to copy">${shareUrl}</span>
                                <button class="btn btn-danger btn-sm" onclick="closeSession('${s.session_id}')">Close</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error('Failed to load sessions:', e);
            }
        }

        async function closeSession(sessionId) {
            if (!confirm('Close this session?')) return;
            try {
                await fetch(`/api/session/${sessionId}/close`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                loadSessions();
            } catch (e) {
                console.error('Failed to close session:', e);
            }
        }

        function copyLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert('Link copied to clipboard!');
            }).catch(() => {
                prompt('Copy this link:', url);
            });
        }

        function showMsg(id, text) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 8000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Auto-refresh sessions every 15s
        setInterval(loadSessions, 15000);

        // Enter key on password field
        document.getElementById('teacherPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
